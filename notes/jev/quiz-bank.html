<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz bank</title>
  <style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #0f172a;
  --muted: #64748b;
  --accent: #2563eb;
  --border: #e2e8f0;
  --code-bg: #f1f5f9;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.65;
}
.wrap {
  max-width: 820px;
  margin: 0 auto;
  padding: 1.5rem 1.25rem 3rem;
}
h1, h2, h3, h4 {
  line-height: 1.25;
  color: var(--text);
}
h1 { font-size: 1.75rem; margin: 0 0 1rem; }
h2 { font-size: 1.35rem; margin: 1.75rem 0 0.75rem; border-bottom: 1px solid var(--border); padding-bottom: 0.35rem; }
h3 { font-size: 1.1rem; margin: 1.35rem 0 0.5rem; color: var(--accent); }
p, li { color: var(--text); }
a { color: var(--accent); }
code, pre {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  background: var(--code-bg);
  border-radius: 6px;
}
code { padding: 0.1rem 0.35rem; font-size: 0.9em; }
pre { padding: 0.9rem 1rem; overflow: auto; border: 1px solid var(--border); }
pre code { padding: 0; background: transparent; }
table {
  width: 100%;
  border-collapse: collapse;
  margin: 1rem 0;
  font-size: 0.92rem;
  background: var(--card);
}
th, td {
  border: 1px solid var(--border);
  padding: 0.55rem 0.65rem;
  text-align: left;
  vertical-align: top;
}
th { background: var(--code-bg); }
blockquote {
  margin: 1rem 0;
  padding: 0.25rem 0 0.25rem 1rem;
  border-left: 4px solid var(--accent);
  color: var(--muted);
}
hr { border: 0; border-top: 1px solid var(--border); margin: 1.5rem 0; }
.meta {
  color: var(--muted);
  font-size: 0.85rem;
  margin-bottom: 1.25rem;
}
.frontmatter {
  display: none;
}
</style>
</head>
<body>
  <main class="wrap">
    <div class="meta">Learn Jev · rendered from quiz-bank.md</div>
    <h1 id="quiz-bank">Quiz bank</h1>
<p>Short retrieval items for blocks 3, 4, and 6. Keep MC options equal length.</p>
<h2 id="seeds">Seeds</h2>
<ol>
<li></li>
</ol>
  </main>
</body>
</html>
