<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Learn Jev — TypeSafe System One typed decisions for software. Personal learning hub." />
  <meta name="color-scheme" content="light dark" />
  <title>Learn Jev — typed decisions for software</title>
  <!-- Root landing for GitHub Pages project site: /learn-jev/ → index.html SPA -->
  <link rel="stylesheet" href="./style.css?v=lib-iframe-2" />
</head>
<body>
  <div class="overlay" id="overlay" aria-hidden="true"></div>

  <aside class="sidebar" id="sidebar" aria-label="Hub navigation">
    <div class="sidebar-header" id="sidebar-home" role="button" tabindex="0" title="Back to overview">
      <div class="brand" id="brand-short">LEARN JEV</div>
      <div class="sub" id="brand-sub">Personal learning hub</div>
    </div>
    <ul class="nav-links" id="nav-links" role="navigation"></ul>
  </aside>

  <div class="main">
    <header class="topbar">
      <button type="button" class="hamburger" id="hamburger" aria-label="Open menu">☰</button>
      <h1 id="topbar-title">Overview</h1>
      <span style="width:2rem"></span>
    </header>
    <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></nav>
    <main class="content">
      <div id="panels">
        <section class="panel active" id="overview">
          <h2 class="section-title">Loading…</h2>
          <p class="section-desc">Reading <code>content.json</code> for the Learn Jev SPA.</p>
        </section>
      </div>
      <footer class="site-footer" id="site-footer"></footer>
    </main>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Visual asset">
    <div class="lightbox-panel">
      <button type="button" class="close-lightbox" id="close-lightbox" aria-label="Close">×</button>
      <div class="lightbox-img-wrap">
        <img id="lightbox-img" alt="" />
      </div>
      <div class="lightbox-copy">
        <h3 id="lightbox-title"></h3>
        <p id="lightbox-desc"></p>
      </div>
    </div>
  </div>

  <noscript>
    <div style="padding:2rem;font-family:system-ui,sans-serif;max-width:40rem;margin:2rem auto">
      <h1>Learn Jev</h1>
      <p>This hub is a JavaScript SPA (same pattern as the aerospace IP law research hub). Enable JavaScript, or open the markdown notes under <code>notes/jev/</code> and <code>reports/</code> on GitHub.</p>
    </div>
  </noscript>

  <script src="./app.js?v=lib-iframe-2" defer></script>
